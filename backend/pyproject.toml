[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "substranslator-backend"
version = "0.1.0"
description = "SubsTranslator backend services"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1.2",
    "Flask-CORS>=6.0.0",
    "faster-whisper>=1.2.0",
    "deep-translator>=1.11.4",
    "yt-dlp>=2025.8.11",
    "requests>=2.32.4",
    "python-dotenv>=1.1.1",
    "celery>=5.4.0",
    "redis>=5.2.1",
    "gunicorn>=23.0.0",
    "openai==1.35.13",
    "Werkzeug>=3.1.3",
    "google-api-python-client>=2.154.0",
    "ffmpeg-python>=0.2.0",
    "kombu>=5.4.2",
    "billiard>=4.2.1",
    "structlog>=24.4.0",
    "firebase-admin>=6.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# --strict-markers turns a typo'd mark into an error instead of a silent no-op,
# so every mark below must stay in sync with what the suite actually uses.
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Fast unit tests with mocked dependencies",
    "integration: Service-level tests hitting real dependencies",
    "e2e: End-to-end tests (slow)",
    "slow: Tests that take longer to run",
    "youtube: Tests that require YouTube access",
    "openai: Tests that require OpenAI API key",
    "benchmark: Long-running performance benchmarks (opt-in)"
]
# Safety net: no single test may hang the suite (see the OpenAI rate-limiter
# backoff that used to stall these files for 10-17 minutes). Requires
# pytest-timeout, which ships in requirements-test.txt.
timeout = 300
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
