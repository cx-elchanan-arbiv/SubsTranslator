# glibc address-selection policy for the backend/worker containers (RFC 6724).
#
# Why this file exists: the compose network hands containers a ULA IPv6 address
# (fd91:...). glibc's stock table gives ULA a different *label* from global IPv6
# destinations, so rule 5 ("prefer matching label") makes every dual-stack host
# resolve to IPv4 first — and yt-dlp then talks to YouTube over the home IPv4,
# which Google's "unusual traffic" gate flags from time to time (measured
# 2026-09-22: curl -4 → 302 google.com/sorry, curl -6 → 200). The Mac itself
# never sees that because macOS prefers IPv6.
#
# One change from glibc's default table: fc00::/7 gets label 1, the same label
# as ::/0. With that, IPv6 destinations win on precedence (40 vs 10) whenever the
# container has any IPv6 route, and the IPv4 address stays as the fallback.
# Everything else below is glibc's default, spelled out because any `label` line
# replaces the whole built-in table.
label ::1/128       0
label ::/0          1
label 2002::/16     2
label ::/96         3
label ::ffff:0:0/96 4
label fec0::/10     5
label fc00::/7      1
label 2001:0::/32   7
precedence ::1/128       50
precedence ::/0          40
precedence 2002::/16     30
precedence ::/96         20
precedence ::ffff:0:0/96 10
