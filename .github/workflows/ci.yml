name: CI

# Run on push to main and all Pull Requests to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: 📦 Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        
    - name: 📦 Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-test.txt
        pip install -e backend/
        
    - name: 🧪 Run Backend Tests with Coverage
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        FLASK_TESTING: "1"
        DISABLE_RATE_LIMIT: "1"
        TESTING: "true"
      run: |
        # Run only unit tests in CI (integration tests require Docker/services)
        python -m pytest backend/tests/unit/ -v --tb=short -m unit --cov=backend --cov-report=xml --cov-report=term
        
    - name: 📈 Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage

  integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    # 167 tests that never ran on a PR until now — including every pixel/render test in
    # tests/integration/test_bidi_render.py and test_subtitle_layout_render.py, i.e. the
    # only checks in the repo that look at what the burned-in subtitles actually LOOK
    # like.
    timeout-minutes: 20

    # The cleanup-task tests run Celery eagerly against a real broker; without one they
    # fail on "Connection refused" rather than on anything they are testing. A service
    # container is the honest fix — the alternative was skipping them, which is how a
    # gate stops being a gate.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install System Dependencies
      run: |
        sudo apt-get update
        # fonts-noto-core carries NotoSansHebrew-{Regular,Bold}.ttf. It is REQUIRED, not
        # nice-to-have: both render suites skip themselves when the Hebrew font is
        # missing (test_bidi_render walks /usr/share/fonts for "NotoSansHebrew";
        # test_subtitle_layout_render needs ASS_FONTS_DIR to be a real directory), and a
        # render gate that skips is a gate that is not there.
        sudo apt-get install -y ffmpeg fontconfig fonts-noto-core

    - name: ✅ Verify the render prerequisites (fail instead of skipping)
      run: |
        set -e
        ffmpeg -version | head -1
        # Verified on ubuntu:24.04: fonts-noto-core installs both files below.
        test -f /usr/share/fonts/truetype/noto/NotoSansHebrew-Regular.ttf
        test -f /usr/share/fonts/truetype/noto/NotoSansHebrew-Bold.ttf
        fc-list | grep -i "Noto Sans Hebrew" | head -2
        echo "ffmpeg + Noto Sans Hebrew present — the render tests will RUN, not skip."

    - name: 📦 Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-test.txt
        pip install -e backend/

    - name: 🧪 Run Backend Integration Tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        FLASK_TESTING: "1"
        DISABLE_RATE_LIMIT: "1"
        TESTING: "true"
        # test_subtitle_layout_render defaults to the container's font path
        # (/usr/share/fonts/truetype/hebrew), which does not exist on a runner.
        ASS_FONTS_DIR: /usr/share/fonts/truetype/noto
      run: |
        python -m pytest backend/tests/integration -v --tb=short

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
        
    - name: 📦 Install Dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: 🧪 Run Frontend Tests
      working-directory: ./frontend
      run: npm test -- --coverage --watchAll=false --verbose
      
    - name: 📈 Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  lint-and-format:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: 📦 Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
        
    - name: 🔍 Check Python Code Style (Backend)
      env:
        FLASK_TESTING: "1"
        DISABLE_RATE_LIMIT: "1"
        TESTING: "true"
      run: |
        pip install black isort
        pip install -r backend/requirements.txt
        pip install -e backend/
        # Check formatting
        black --check backend/
        # Check imports
        isort --check-only backend/
        # NOTE: `ruff check backend/` is intentionally NOT gated yet. The backend is
        # black/isort-clean, but ruff's configured rule set ([tool.ruff] in
        # backend/pyproject.toml) still reports ~190 findings that need judgement,
        # not formatting: B904 (raise ... from), E722 (bare except), E402
        # (deliberate late imports), B023 (closure-over-loop-variable). Turning it on
        # is a separate, reviewable change — auto-fixing it is NOT safe here: a
        # `ruff --fix` pass silently deleted the side-effect `import tasks` from
        # celery_worker.py, which would have shipped a worker with zero tasks.

    - name: 🔍 Check TypeScript Code Style (Frontend)
      working-directory: ./frontend
      run: |
        npm ci
        # Check TypeScript compilation
        npm run build
        # Check linting (if you have ESLint configured)
        # npm run lint

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    # DISABLED — still blocked on the security workstream, not on this job's wiring.
    # Note this job does NOT run tests/integration/test_5_security_basics.py (that one
    # now runs in integration-tests above, and it is green): all three steps below fail
    # on their own, for reasons that predate this workflow.
    #
    # RE-VERIFIED 2026-08-11 by running each step's exact command against this tree in a
    # clean python:3.12-slim container:
    #   * pip-audit -r backend/requirements.txt
    #       -> "Found 16 known vulnerabilities in 6 packages": flask 3.1.2, requests
    #          2.32.4, werkzeug 3.1.3 (x3), yt-dlp 2025.10.14 (x9), python-dotenv 1.1.1,
    #          deep-translator 1.11.4 (no fix published). Exits non-zero.
    #   * bandit -r backend/ -x backend/venv/,backend/__pycache__/
    #       -> 4 High / 24 Medium / 2172 Low. (The 2026-08-03 note in this file said
    #          67 findings; the Low count is now dominated by B101 assert_used across
    #          the test suite, which has roughly tripled since.) Exits non-zero.
    #   * npm audit --audit-level high  (in ./frontend)
    #       -> "63 vulnerabilities (11 low, 16 moderate, 33 high, 3 critical)", almost
    #          all react-scripts transitives; `npm audit fix --force` is a breaking
    #          upgrade. Exits non-zero.
    #
    # TO ENABLE, all of the following must be true — delete `if: false` only then:
    #   1. pip-audit on backend/requirements.txt reports 0 vulnerabilities, or every
    #      remaining one is listed in an explicit `--ignore-vuln` allowlist with a
    #      written reason (deep-translator PYSEC-2022-252 has no fix, so it needs one).
    #   2. bandit reports 0 findings at the severity the step gates on. Either triage
    #      them or pin the gate to what is actually being asserted, e.g.
    #      `bandit -r backend/ -ll -x backend/venv/,backend/__pycache__/,backend/tests/`
    #      (Medium+ and excluding tests) — and say so here, so the next reader knows
    #      the Lows are deliberately out of scope rather than accidentally missed.
    #   3. `npm audit --audit-level high` in ./frontend exits 0, which today means the
    #      react-scripts upgrade has landed and the frontend still builds and tests.
    # Do NOT enable it by loosening a threshold until the number happens to pass.
    #
    # Even once green, pip-audit and npm audit are TIME-VARYING: a green run today goes
    # red tomorrow when a new advisory lands, with no code change. So the destination
    # for this job is `schedule:` (plus the allowlist above), not a per-PR blocking gate
    # in all-tests-passed's `needs`.
    if: false

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: 🔧 Create Virtual Environment
      run: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install -U pip setuptools wheel
        
    - name: 📦 Install Dependencies
      run: |
        source .venv/bin/activate
        pip install -r backend/requirements.txt
        pip install pip-audit bandit
        
    - name: 🔒 Security Audit (Project Dependencies Only)
      run: |
        source .venv/bin/activate
        pip-audit -r backend/requirements.txt --desc
        
    - name: 🔒 Code Security Analysis
      run: |
        source .venv/bin/activate
        bandit -r backend/ -x backend/venv/,backend/__pycache__/
        
    - name: 🔒 Run Node.js Security Audit
      working-directory: ./frontend
      run: |
        npm audit --audit-level high



  # Job שמצרף את כל התוצאות - נדרש לבדיקת הגנת הענף
  all-tests-passed:
    name: ✅ All Tests Passed
    runs-on: ubuntu-latest
    # This job is what branch protection watches, so `needs` IS the gate — a job left
    # out of this list can go red without blocking a merge. lint-and-format was missing
    # from it, which meant a black/isort failure did not stop anything.
    needs: [backend-tests, integration-tests, frontend-tests, lint-and-format]

    steps:
    - name: ✅ All Checks Passed
      run: |
        echo "🎉 כל הטסטים עברו בהצלחה!"
        echo "🚀 הקוד מוכן למערג ל-main"

    - name: 📊 Summary
      run: |
        echo "### 📋 Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Backend Unit Tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Backend Integration Tests (incl. pixel/render): Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Frontend Tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Code Quality (black + isort + tsc): Passed" >> $GITHUB_STEP_SUMMARY

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎯 **Ready for merge to main!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "ℹ️ *E2E tests and the security scan are still run manually — see security-check in ci.yml*" >> $GITHUB_STEP_SUMMARY
