name: CI

# Run on push to main and all Pull Requests to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v6
      
    - name: 🐍 Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: 📦 Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        
    - name: 📦 Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install -r backend/requirements-test.txt
        pip install -e backend/
        
    - name: 🧪 Run Backend Tests with Coverage
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        FLASK_TESTING: "1"
        DISABLE_RATE_LIMIT: "1"
        TESTING: "true"
      run: |
        # Run only unit tests in CI (integration tests require Docker/services)
        python -m pytest backend/tests/unit/ -v --tb=short -m unit --cov=backend --cov-report=xml --cov-report=term
        
    - name: 📈 Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: backend
        name: backend-coverage

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v6
      
    - name: 📦 Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
        
    - name: 📦 Install Dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: 🧪 Run Frontend Tests
      working-directory: ./frontend
      run: npm test -- --coverage --watchAll=false --verbose
      
    - name: 📈 Upload Coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  lint-and-format:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v6
      
    - name: 🐍 Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: 📦 Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./frontend/package-lock.json
        
    - name: 🔍 Check Python Code Style (Backend)
      env:
        FLASK_TESTING: "1"
        DISABLE_RATE_LIMIT: "1"
        TESTING: "true"
      run: |
        pip install black isort
        pip install -r backend/requirements.txt
        pip install -e backend/
        # Check formatting
        black --check backend/
        # Check imports
        isort --check-only backend/
        # NOTE: `ruff check backend/` is intentionally NOT gated yet. The backend is
        # black/isort-clean, but ruff's configured rule set ([tool.ruff] in
        # backend/pyproject.toml) still reports ~190 findings that need judgement,
        # not formatting: B904 (raise ... from), E722 (bare except), E402
        # (deliberate late imports), B023 (closure-over-loop-variable). Turning it on
        # is a separate, reviewable change — auto-fixing it is NOT safe here: a
        # `ruff --fix` pass silently deleted the side-effect `import tasks` from
        # celery_worker.py, which would have shipped a worker with zero tasks.

    - name: 🔍 Check TypeScript Code Style (Frontend)
      working-directory: ./frontend
      run: |
        npm ci
        # Check TypeScript compilation
        npm run build
        # Check linting (if you have ESLint configured)
        # npm run lint

  security-check:
    name: Security Scan
    runs-on: ubuntu-latest
    # DISABLED — blocked on the security workstream, not on this job's wiring.
    # Verified 2026-08-03 against the current tree:
    #   * pip-audit  -> 16 known CVEs across 6 pinned deps (flask, requests, werkzeug,
    #                   yt-dlp, python-dotenv, deep-translator). Green requires
    #                   dependency upgrades + regression testing.
    #   * bandit     -> 67 findings (1 High / 6 Medium / 60 Low) needing triage.
    #   * npm audit  -> 62 findings (3 critical / 32 high), almost all react-scripts
    #                   transitives; `npm audit fix --force` is a breaking upgrade.
    # Enabling it before that work lands would make every unrelated PR red. Note also
    # that pip-audit/npm audit are time-varying: a green run today goes red tomorrow
    # when a new advisory lands, with no code change — so this job wants a scheduled
    # run + explicit allowlist, not a per-PR blocking gate.
    if: false

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v6
      
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: 🔧 Create Virtual Environment
      run: |
        python -m venv .venv
        source .venv/bin/activate
        python -m pip install -U pip setuptools wheel
        
    - name: 📦 Install Dependencies
      run: |
        source .venv/bin/activate
        pip install -r backend/requirements.txt
        pip install pip-audit bandit
        
    - name: 🔒 Security Audit (Project Dependencies Only)
      run: |
        source .venv/bin/activate
        pip-audit -r backend/requirements.txt --desc
        
    - name: 🔒 Code Security Analysis
      run: |
        source .venv/bin/activate
        bandit -r backend/ -x backend/venv/,backend/__pycache__/
        
    - name: 🔒 Run Node.js Security Audit
      working-directory: ./frontend
      run: |
        npm audit --audit-level high



  # Job שמצרף את כל התוצאות - נדרש לבדיקת הגנת הענף
  all-tests-passed:
    name: ✅ All Tests Passed
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - name: ✅ All Checks Passed
      run: |
        echo "🎉 כל הטסטים עברו בהצלחה!"
        echo "🚀 הקוד מוכן למערג ל-main"
        
    - name: 📊 Summary
      run: |
        echo "### 📋 Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Backend Unit Tests: Passed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Frontend Tests: Passed" >> $GITHUB_STEP_SUMMARY  

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🎯 **Ready for merge to main!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "ℹ️ *Integration and E2E tests can be run manually via GitHub Actions*" >> $GITHUB_STEP_SUMMARY
