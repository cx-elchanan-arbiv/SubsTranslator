server {
        listen 80;
        client_max_body_size 500M; # Allow larger file uploads

        # ביצועים להזרמות גדולות
        sendfile on;
        tcp_nopush on;
        aio on;
        directio 4m;
        output_buffers 2 1m;

        # כותרות אבטחה בסיסיות
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header X-XSS-Protection "1; mode=block";

        # Translation files must never be served stale. The JS bundle is
        # content-hashed, so a deploy always fetches new code — but /locales keeps
        # the same URL forever, and with only ETag/Last-Modified a browser is free
        # to reuse its copy without asking. That is exactly what happened: new code
        # asked for a key the CACHED translation file did not have, and the UI
        # rendered "errors.salvageTitle" at the user. `no-cache` does not mean "do
        # not cache" — it means "revalidate every time", and with the ETag already
        # present the answer is a 304 with no body. The cost is one conditional
        # request; the alternative is a UI that shows its own source keys after
        # every translation change.
        location /locales/ {
            root   /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Increase timeouts for long-running requests
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Direct downloads
        location /downloads/ {
            alias /app/downloads/;
            add_header Content-Disposition "attachment";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
