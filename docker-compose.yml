services:
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - downloads:/app/downloads  # Phase A: Use named volume
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    user: "501:20"
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - DEBUG=False
      - LOG_LEVEL=INFO
      - DEFAULT_WHISPER_MODEL=large  # the owner's real default; base was a 2GB-prod-machine relic
      - FAST_WORK_DIR=/app/fast_work  # Phase A: Fast workspace env var
      - TRANSLATION_PARALLELISM=1  # P1: Optimal configuration (Test 1 winner)
      - TRANSLATION_BATCH_SIZE=20  # P1: Segments per translation batch
      - MAX_CONCURRENT_OPENAI_REQUESTS=1  # P1: Single worker (best performance)
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - UPLOAD_FOLDER=/app/uploads
      - DOWNLOADS_FOLDER=/app/downloads
      - ASSETS_FOLDER=/app/assets
      - STATS_FOLDER=/app/storage/stats  # Statistics JSONL storage
      - WHISPER_MODELS_DIR=/app/storage/whisper_models  # Whisper models cache
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - downloads:/app/downloads  # Phase A: Use named volume
      - storage:/app/storage  # Persistent storage (stats + whisper models)
      # Phase A: tmpfs for fast I/O operations - temporarily using regular volume due to permission issues
      - ./backend/fast_work:/app/fast_work
    command: ["gunicorn", "--bind", "0.0.0.0:8081", "--workers", "2", "--worker-class", "gthread", "--threads", "4", "--timeout", "300", "--max-requests", "1000", "--max-requests-jitter", "100", "app:app"]
    depends_on:
      - redis

  redis:
    image: "redis:alpine"
    restart: unless-stopped
    # ports הוסר — redis מקומי על 6379 מתנגש; הגישה הפנימית redis://redis:6379 עובדת.
    # לדיבוג מההוסט בלי התנגשות: map "6380:6379" (לא 6379).

  worker:
    build:
      context: .
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    # Consumes BOTH queues declared in celery_config.task_queues that actually get
    # work: `processing` (video jobs) and `cleanup` (beat-scheduled disk reclaim).
    # Without `cleanup` here the beat_schedule entries pile up unconsumed in Redis
    # forever and the disk is never reclaimed.
    command: ["celery", "-A", "celery_worker.celery_app", "worker", "-l", "info", "-Q", "processing,cleanup", "--concurrency=1", "--max-tasks-per-child=1"]
    user: "501:20"
    env_file:
      - .env
    environment:
      - FLASK_ENV=development
      - DEBUG=False
      - LOG_LEVEL=INFO
      - DEFAULT_WHISPER_MODEL=large  # the owner's real default; base was a 2GB-prod-machine relic
      - WORKER_CONCURRENCY=1
      - FAST_WORK_DIR=/app/fast_work  # Phase A: Fast workspace env var
      - TRANSLATION_PARALLELISM=1  # P1: Optimal configuration (Test 1 winner)
      - TRANSLATION_BATCH_SIZE=20  # P1: Segments per translation batch
      - MAX_CONCURRENT_OPENAI_REQUESTS=1  # P1: Single worker (best performance)
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - UPLOAD_FOLDER=/app/uploads
      - DOWNLOADS_FOLDER=/app/downloads
      - ASSETS_FOLDER=/app/assets
      - STATS_FOLDER=/app/storage/stats  # Statistics JSONL storage
      - WHISPER_MODELS_DIR=/app/storage/whisper_models  # Whisper models cache
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - downloads:/app/downloads  # Phase A: Use named volume
      - storage:/app/storage  # Persistent storage (stats + whisper models)
      # Phase A: tmpfs for fast I/O operations - temporarily using regular volume due to permission issues
      - ./backend/fast_work:/app/fast_work
    depends_on:
      - redis
      - backend
    # 8g was not enough to keep the promise the rest of the config makes. The worker
    # sits at ~3g mid-job, leaving ~5g headroom — under the 6g bar `whisper_smart`
    # requires for `large`, which is now the default model. With the memory guard
    # wired into the real transcription paths (it used to be bypassed), an 8g limit
    # would silently answer every `large` request with `medium`. The host has ~20g and
    # a limit is a ceiling, not a reservation, so 12g costs nothing and lets the
    # default model actually run.
    mem_limit: 12g
    mem_reservation: 4g
    oom_kill_disable: false

  beat:
    build:
      context: .
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "celery_worker.celery_app", "beat", "-l", "info"]
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - redis
      - backend

# Phase A: Named volumes for shared storage
volumes:
  downloads:
  storage:  # Persistent storage (stats + whisper models)

# IPv6 on the compose network. YouTube (Google's "unusual traffic" gate) flags the
# home IPv4 address from time to time; the host escapes it because macOS prefers
# IPv6 to youtube.com, but a plain compose network is IPv4-only, so every yt-dlp
# call from the containers hit "Sign in to confirm you're not a bot" (2026-09-22).
# This line only gives the containers an IPv6 route (a Docker ULA); on its own
# glibc would still pick IPv4 first — the image's /etc/gai.conf (see gai.conf at
# the repo root) is what makes the containers actually prefer IPv6. Both halves
# are needed. Needs `docker compose down && up -d` to take effect.
networks:
  default:
    enable_ipv6: true
